version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Install pnpm globally
        - npm install -g pnpm
        # Install project dependencies
        - pnpm install
    build:
      commands:
        # Build Next.js app
        - pnpm run build
  artifacts:
    # Output directory for Next.js SSR
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      # Cache node_modules for faster builds
      - node_modules/**/*
      # Cache Next.js build cache
      - .next/cache/**/*
  customHeaders:
    # Optional: add headers for security / caching
    - pattern: '**/*'
      headers:
        - key: X-Frame-Options
          value: DENY
        - key: X-XSS-Protection
          value: 1; mode=block
        - key: X-Content-Type-Options
          value: nosniff
