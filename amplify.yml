version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Install pnpm globally
        - npm install -g pnpm
        # Install project dependencies
        - pnpm install
    build:
      commands:
        # Build Next.js app
        - pnpm run build
  artifacts:
    # Output directory for Amplify hosting
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      # Cache node_modules and Next.js cache
      - node_modules/**/*
      - .next/cache/**/*
